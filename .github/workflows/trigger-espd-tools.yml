name: Notify espd-tools to update ESPD_CM.eapx

on:
  push:
    branches:
      - testingAutomation

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository dispatch to espd-tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering repository_dispatch in espd-tools..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/your-org/espd-tools/dispatches \
            -d '{"event_type": "update_eapx"}'
