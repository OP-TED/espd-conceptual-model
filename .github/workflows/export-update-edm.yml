name: Export & publish to ESPD-EDM

on:
  workflow_dispatch:
    inputs:
      # Free text rather than a main/develop choice, so a release export can
      # pin a tag or SHA, and an exporter change can be run before it is
      # merged. The default stays main, as before.
      espd_tools_ref:
        description: 'espd-tools ref to use as the exporter and model compiler (branch, tag or SHA). 5.0.0 exports need develop; the model step needs a ref that contains model-compiler.'
        required: true
        default: 'main'
        type: string
      edm_branch:
        description: 'ESPD-EDM branch to publish to, as a plain branch name (for example release/5.0.0, not refs/heads/...). Leave empty to use the branch this workflow runs from (created in ESPD-EDM if it does not exist). When given, the branch must already exist. Nothing is pushed to main.'
        required: false
        default: ''
        type: string

# The GitHub App token does all the cross-repository work; the built-in token
# only needs to read this repository.
permissions:
  contents: read

# One publication per ESPD-EDM branch at a time, so two dispatches cannot race on
# the push. Queued rather than cancelled: each run publishes a specific export.
concurrency:
  group: export-update-edm-${{ inputs.edm_branch || github.ref_name }}
  cancel-in-progress: false

env:
  RUN_BRANCH: ${{ github.ref_name }}
  ESPD_TOOLS_REF: ${{ inputs.espd_tools_ref }}

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    steps:
      # Decides the target before any work is done. The ESPD-EDM branch is the
      # branch this workflow runs from unless edm_branch says otherwise. The guard
      # against main is on the branch being WRITTEN, not on the one this workflow
      # runs from: the two differ whenever edm_branch is given, so a check on
      # github.ref would let a run from a feature branch with edm_branch=main push
      # to ESPD-EDM main. A main target still runs the export and the compile (a
      # dry run) but never pushes.
      - name: Resolve the ESPD-EDM target branch
        env:
          INPUT_EDM_BRANCH: ${{ inputs.edm_branch }}
        run: |
          # A plain branch name only: the concurrency group above is built from the raw input, so two spellings
          # of one branch ("x" and "refs/heads/x") would get different groups and could race on the push.
          if [[ "${INPUT_EDM_BRANCH}" == refs/* ]]; then
            echo "::error::edm_branch takes a plain branch name (for example release/5.0.0), not \"${INPUT_EDM_BRANCH}\"."
            exit 1
          fi
          target="${INPUT_EDM_BRANCH:-${RUN_BRANCH}}"
          echo "RUN_BRANCH=${RUN_BRANCH}"
          echo "ESPD_TOOLS_REF=${ESPD_TOOLS_REF}"
          echo "EDM_BRANCH=${target}"

          if ! git check-ref-format --branch "${target}" >/dev/null 2>&1; then
            echo "::error::\"${target}\" is not a valid branch name."
            exit 1
          fi
          if [[ "${target}" == "main" ]]; then
            echo "::warning::The target is ESPD-EDM main: this is a dry run, nothing will be pushed."
          fi
          echo "EDM_BRANCH=${target}" >> "${GITHUB_ENV}"
          if [[ -n "${INPUT_EDM_BRANCH}" ]]; then
            echo "EDM_BRANCH_EXPLICIT=true" >> "${GITHUB_ENV}"
          fi

      # Mints a short-lived installation token for the two repositories this
      # workflow touches: espd-tools (read, the exporter source) and ESPD-EDM
      # (read and write, the publication target). Replaces the EDM_PUSH_TOKEN
      # PAT, which was tied to an individual account and stopped resolving -
      # actions/checkout then fell back to no credentials and failed with
      # "could not read Username for 'https://github.com'".
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.EDM_APP_ID }}
          private-key: ${{ secrets.EDM_APP_PRIVATE_KEY }}
          owner: OP-TED
          repositories: |
            espd-tools
            ESPD-EDM

      - name: Checkout conceptual model (this repo)
        uses: actions/checkout@v4
        with:
          path: conceptual-model

      - name: Checkout espd-tools
        uses: actions/checkout@v4
        with:
          repository: OP-TED/espd-tools
          ref: ${{ inputs.espd_tools_ref }}
          path: espd-tools
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run exporter (criteria + code lists)
        working-directory: espd-tools/EAtoJSON
        run: |
          npm ci
          node export.js all ../../conceptual-model/conceptual-model/ESPD_CM.eapx -o outputs
          echo "---- Export tree ----"
          ls -R1 outputs || true
          test -f outputs/espd-edm.json

      # Compiles the published ESPD model (ESPD-EDM/model) from the export just
      # produced plus the enrichment in this repository (enrichment/). It runs before
      # ESPD-EDM is checked out on purpose: a model that does not compile, including
      # enrichment that has drifted from the EA structure (the structural-equivalence
      # gate), stops the run before anything is written to ESPD-EDM. The compiler
      # reads the code lists exported above, so structure, code lists and model all
      # come from the same run. Needs an espd-tools ref that contains model-compiler.
      #
      # TODO: checks on the published model belong to ESPD-EDM (see publish-validation.yml). Add
      # `node verify.mjs --model model --edm criterion/espd-edm.json` (espd-tools/model-compiler)
      # to ESPD-EDM's Checks workflow, which is not on the 5.0.0 branches yet.
      - name: Compile the ESPD model
        working-directory: espd-tools/model-compiler
        run: |
          # The ref can be a moving branch name, so record the commit it resolved to as well.
          tools_sha="$(git rev-parse --short HEAD)"
          npm ci
          node build.mjs \
            --out ../../model-out \
            --edm ../EAtoJSON/outputs/espd-edm.json \
            --enrichment ../../conceptual-model/enrichment \
            --codelists ../EAtoJSON/outputs/code-lists \
            --source-ref "espd-conceptual-model@${{ github.sha }} espd-tools@${tools_sha} (ref ${ESPD_TOOLS_REF})"
          test -f ../../model-out/compiled-model.json

      - name: Checkout ESPD-EDM
        uses: actions/checkout@v4
        with:
          repository: OP-TED/ESPD-EDM
          path: espd-edm
          token: ${{ steps.app-token.outputs.token }}

      # With edm_branch given the branch has to exist already: creating it here
      # would base it on ESPD-EDM's default branch, which carries a different
      # release's layout, and the export would land on the wrong content. Without
      # edm_branch the branch named like the run branch is created when missing, as
      # before.
      - name: Switch/Create branch in ESPD-EDM
        working-directory: espd-edm
        run: |
          git fetch origin
          if git rev-parse --verify --quiet "refs/remotes/origin/${EDM_BRANCH}" >/dev/null; then
            # -B with an explicit start point, so a branch name that matches a
            # path cannot be read as one.
            git checkout -B "${EDM_BRANCH}" "origin/${EDM_BRANCH}"
          elif [[ "${EDM_BRANCH_EXPLICIT:-}" == "true" ]]; then
            echo "::error::ESPD-EDM has no branch \"${EDM_BRANCH}\". Create it from the right release branch first."
            exit 1
          else
            git checkout -b "${EDM_BRANCH}"
          fi

      - name: Copy results into final folders
        run: |
          # ensure target folders exist
          mkdir -p espd-edm/criterion
          mkdir -p espd-edm/codelists

          # copy the JSON
          cp espd-tools/EAtoJSON/outputs/espd-edm.json espd-edm/criterion/espd-edm.json

          # copy/update all .gc code lists
          if [ -d "espd-tools/EAtoJSON/outputs/code-lists" ]; then
            find espd-tools/EAtoJSON/outputs/code-lists -type f -name '*.gc' -print0 | xargs -0 -I{} cp "{}" espd-edm/codelists
          
            if [ -f "espd-tools/EAtoJSON/outputs/code-lists/codelists.json" ]; then
              cp espd-tools/EAtoJSON/outputs/code-lists/codelists.json espd-edm/codelists/
            fi
          fi

          # The model folder is generated as a whole, so replace it rather than merge:
          # a criterion removed from the model must not linger in ESPD-EDM.
          rm -rf espd-edm/model
          cp -r model-out espd-edm/model

          echo "Copied:"
          ls -1 espd-edm/criterion/espd-edm.json
          ls -1 espd-edm/codelists | head -n 20 || true
          ls -1 espd-edm/model

        # make the codelists/gc folder mirror the export exactly (including deletions)
        # - name: Mirror codelists/gc exactly (dangerous - will delete extras)
        #   run: |
        #     rsync -a --delete espd-tools/EAtoJSON/outputs/code-lists/ espd-edm/codelists/gc/

      - name: Commit and push to ESPD-EDM@${{ env.EDM_BRANCH }}
        if: env.EDM_BRANCH != 'main' # never push to ESPD-EDM main (the check is on the target, not the run branch)
        working-directory: espd-edm
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ $(git status --porcelain) ]]; then
            git add criterion/espd-edm.json codelists/*.gc codelists/codelists.json model
            git commit -m "Automation: update espd-edm.json, codelists (.gc) and the compiled model from espd-tools [branch: ${EDM_BRANCH}]"
            git push origin "${EDM_BRANCH}"
          else
            echo "No changes to commit in ESPD-EDM"
          fi
