name: Export & publish to ESPD-EDM

on:
  workflow_dispatch:
    inputs:
      # Free text rather than a main/develop choice, so a release export can
      # pin an immutable tag or SHA, and a change to the exporter can be run
      # before it is merged. The version gates below need an espd-tools ref
      # that has check-versions, verify-export and npm test.
      espd_tools_ref:
        description: 'espd-tools ref to use as the exporter (branch, tag or SHA)'
        required: true
        default: 'develop'
        type: string
      expected_version:
        description: 'ESPD version being built (e.g. 5.0.0). Leave empty on a release/X.Y.Z branch to derive it from the branch name.'
        required: false
        default: ''
        type: string

env:
  RUN_BRANCH: ${{ github.ref_name }}
  ESPD_TOOLS_REF: ${{ inputs.espd_tools_ref }}

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Show chosen branch
        run: |
          echo "RUN_BRANCH=${RUN_BRANCH}"
          echo "ESPD_TOOLS_REF=${ESPD_TOOLS_REF}"

      # Mints a short-lived installation token for the two repositories this
      # workflow touches: espd-tools (read, the exporter source) and ESPD-EDM
      # (read and write, the publication target). Replaces the EDM_PUSH_TOKEN
      # PAT, which was tied to an individual account and stopped resolving -
      # actions/checkout then fell back to no credentials and failed with
      # "could not read Username for 'https://github.com'".
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.EDM_APP_ID }}
          private-key: ${{ secrets.EDM_APP_PRIVATE_KEY }}
          owner: OP-TED
          repositories: |
            espd-tools
            ESPD-EDM

      - name: Checkout conceptual model (this repo)
        uses: actions/checkout@v4
        with:
          path: conceptual-model

      - name: Checkout espd-tools
        uses: actions/checkout@v4
        with:
          repository: OP-TED/espd-tools
          ref: ${{ inputs.espd_tools_ref }}
          path: espd-tools
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Every gate below is implemented in .github/scripts/version-gate.sh, so
      # the checks can be read in one place and run by hand before a release
      # export is dispatched. EXPECTED_VERSION is written to the job
      # environment here and consumed by each later gate.
      - name: Resolve the expected ESPD version
        id: version
        env:
          INPUT_EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: bash conceptual-model/.github/scripts/version-gate.sh resolve

      - name: Install exporter dependencies
        working-directory: espd-tools/EAtoJSON
        run: npm ci

      # The gates are only worth their exit codes if they work, so the
      # exporter's own consistency tests run first.
      - name: Self-test the version gate
        run: bash conceptual-model/.github/scripts/version-gate.sh self-test

      # Fails before anything is written if the model's versions disagree with
      # each other or with the release being built. This is the check that would
      # have caught codelists.json going out as 5.0.0-alpha.2 while every code
      # list in the same model declared 5.0.0.
      - name: Check versions declared in the conceptual model
        run: bash conceptual-model/.github/scripts/version-gate.sh check-model

      - name: Run exporter (criteria + code lists)
        working-directory: espd-tools/EAtoJSON
        run: |
          if [[ -n "${EXPECTED_VERSION}" ]]; then
            node export.js all ../../conceptual-model/conceptual-model/ESPD_CM.eapx -o outputs --expect-version "${EXPECTED_VERSION}"
          else
            node export.js all ../../conceptual-model/conceptual-model/ESPD_CM.eapx -o outputs
          fi
          echo "---- Export tree ----"
          ls -R1 outputs || true
          test -f outputs/espd-edm.json

      # Re-checks the generated files as a consumer would, with no access to the
      # model: document version against every .gc, index against the folder
      # contents, and the canonical ordering that keeps the diff reviewable.
      - name: Verify exported code lists
        run: bash conceptual-model/.github/scripts/version-gate.sh verify-output

      - name: Checkout ESPD-EDM
        uses: actions/checkout@v4
        with:
          repository: OP-TED/ESPD-EDM
          path: espd-edm
          token: ${{ steps.app-token.outputs.token }}

      - name: Switch/Create branch in ESPD-EDM
        working-directory: espd-edm
        run: |
          git fetch origin
          if git rev-parse --verify origin/${RUN_BRANCH} >/dev/null 2>&1; then
            git checkout ${RUN_BRANCH}
          else
            git checkout -b ${RUN_BRANCH}
          fi

      - name: Copy results into final folders
        run: |
          # ensure target folders exist
          mkdir -p espd-edm/criterion
          mkdir -p espd-edm/codelists

          # copy the JSON
          cp espd-tools/EAtoJSON/outputs/espd-edm.json espd-edm/criterion/espd-edm.json

          # copy/update all .gc code lists
          if [ -d "espd-tools/EAtoJSON/outputs/code-lists" ]; then
            find espd-tools/EAtoJSON/outputs/code-lists -type f -name '*.gc' -print0 | xargs -0 -I{} cp "{}" espd-edm/codelists
          
            if [ -f "espd-tools/EAtoJSON/outputs/code-lists/codelists.json" ]; then
              cp espd-tools/EAtoJSON/outputs/code-lists/codelists.json espd-edm/codelists/
            fi
          fi

          echo "Copied:"
          ls -1 espd-edm/criterion/espd-edm.json
          ls -1 espd-edm/codelists | head -n 20 || true

        # make the codelists/gc folder mirror the export exactly (including deletions)
        # - name: Mirror codelists/gc exactly (dangerous - will delete extras)
        #   run: |
        #     rsync -a --delete espd-tools/EAtoJSON/outputs/code-lists/ espd-edm/codelists/gc/

      # Last gate before the push: the files exactly as they will be committed,
      # in their ESPD-EDM layout. Catches anything the copy step introduced -
      # a stale .gc left behind from an earlier release, or a ublVersion that no
      # longer matches the UBL schemas actually shipped in schemas/.
      - name: Verify ESPD-EDM working tree before committing
        run: bash conceptual-model/.github/scripts/version-gate.sh verify-edm

      - name: Commit and push to ESPD-EDM@${{ env.RUN_BRANCH }}
        if: github.ref != 'refs/heads/main' # only push changes if not on main branch
        working-directory: espd-edm
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ $(git status --porcelain) ]]; then
            git add criterion/espd-edm.json codelists/*.gc codelists/codelists.json
            git commit -m "Automation: update espd-edm.json and codelists (.gc) from espd-tools export.js [branch: ${RUN_BRANCH}]"
            git push origin ${RUN_BRANCH}
          else
            echo "No changes to commit in ESPD-EDM"
          fi
